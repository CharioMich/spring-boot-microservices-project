global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
#      - targets: ['host.docker.internal:9000'] ## for local testing, replace with 'api-gateway:9000' when running in Docker
      - targets: ['api-gateway:9000']
  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
#      - targets: ['host.docker.internal:8080'] ## for local testing, replace with 'product-service:8080' when running in Docker
      - targets: ['product-service:8080']
        labels:
          application: 'Product Service'
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-service:8081']
        labels:
          application: 'Order Service'
  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory-service:8082']
        labels:
          application: 'Inventory Service'
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8083']
        labels:
          application: 'Notification Service'